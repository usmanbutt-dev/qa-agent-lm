[project]
name = "qa-agent-lm"
version = "0.1.0"
description = "An evaluated browser-testing agent with a fine-tuned tool-selection model"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
  { name = "Muhammad Usman Butt" },
]
dependencies = []

[dependency-groups]
dev = [
  "jsonschema[format]>=4.25,<5",
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "ruff>=0.13,<1",
  "types-jsonschema>=4.25,<5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "PIE", "RUF", "SIM", "UP"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["scripts", "tests"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-q"]
pythonpath = ["."]
testpaths = ["tests"]
